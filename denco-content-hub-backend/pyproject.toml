[project]
name = "denco-content-hub-backend"
version = "0.1.0"
description = "DENCO Content Hub — SaaS platform for content management"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "yt-dlp>=2024.12.0",
    "psycopg2-binary>=2.9.0",
    "openai-whisper>=20231117",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pyrefly>=0.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "fakeredis>=2.26.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "N818",  # project convention: *Exception, not *Error
    "RUF001",  # allow Cyrillic characters (Russian text content)
    "RUF002",  # allow Cyrillic in docstrings (Russian documentation)
    "RUF003",  # allow Cyrillic in comments (Russian comments)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
